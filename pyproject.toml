[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blue_ocean"
version = "0.1.0"
description = "Minimal Python project."
readme = "README.md"
requires-python = ">=3.11"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
# プロジェクトの最小サポートPythonに合わせる（CIやpre-commitが3.11なので py311 が安全）
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

